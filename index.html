
<!DOCTYPE html>

<head>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus+Jakarta+Sans', sans-serif;
            background-color: #000;
            color: #fff;
            margin: 0;
            overflow-x: hidden;
        }
        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px border-white/10;
        }
        .ton-gradient {
            background: linear-gradient(135deg, #0088CC 0%, #00A3FF 100%);
        }
        @keyframes pulsate {
            0% { transform: scale(1); opacity: 0.8; box-shadow: 0 0 0 0 rgba(0, 163, 255, 0.4); }
            50% { transform: scale(1.05); opacity: 1; box-shadow: 0 0 50px 10px rgba(0, 163, 255, 0.6); }
            100% { transform: scale(1); opacity: 0.8; box-shadow: 0 0 0 0 rgba(0, 163, 255, 0.4); }
        }
        .animate-pulsate {
            animation: pulsate 2s infinite ease-in-out;
        }
    </style>
